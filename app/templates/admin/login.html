<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Noise E-Commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-rose-600/20 border border-rose-500/30 text-rose-500 mb-3 shadow-lg shadow-rose-950">
                <i class="fa-solid fa-shield-halved text-xl"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">noise<span class="text-rose-500">.</span>admin</h1>
            <p class="text-xs text-slate-400 mt-1 font-medium">Store Management & Ranking Engine Console</p>
        </div>

        <!-- Login Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="p-3 mb-4 rounded-xl text-xs flex items-center gap-2
                            {% if category == 'success' %} bg-emerald-950/60 text-emerald-300 border border-emerald-800
                            {% elif category == 'info' %} bg-sky-950/60 text-sky-300 border border-sky-800
                            {% else %} bg-rose-950/60 text-rose-300 border border-rose-800 {% endif %}">
                            <i class="fa-solid fa-circle-info text-xs"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Error Alert -->
            {% if error %}
                <div class="p-3 mb-4 rounded-xl text-xs flex items-center gap-2 bg-rose-950/60 text-rose-300 border border-rose-800">
                    <i class="fa-solid fa-triangle-exclamation text-xs text-rose-400"></i>
                    <span>{{ error }}</span>
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('admin.login', next=request.args.get('next')) }}" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                            <i class="fa-solid fa-user text-xs"></i>
                        </span>
                        <input type="text" id="username" name="username" required autofocus
                            placeholder="admin"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock text-xs"></i>
                        </span>
                        <input type="password" id="password" name="password" required
                            placeholder="••••••••"
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition">
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition shadow-lg shadow-rose-950 flex items-center justify-center gap-2 mt-6">
                    <i class="fa-solid fa-right-to-bracket text-xs"></i>
                    <span>Sign In to Admin</span>
                </button>
            </form>
        </div>

        <!-- Back to Storefront Link -->
        <div class="text-center mt-6">
            <a href="{{ url_for('storefront.index') }}" class="text-xs text-slate-500 hover:text-slate-300 transition inline-flex items-center gap-1.5">
                <i class="fa-solid fa-arrow-left text-[10px]"></i>
                <span>Return to Noise Storefront</span>
            </a>
        </div>
    </div>
</body>
</html>
